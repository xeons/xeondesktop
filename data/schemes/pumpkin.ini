# A Windows 2000/XP classic colour scheme.
# Colours: Windows XP's values as listed in "Windows System Colours (by OS)",
# https://gist.github.com/zaxbux/64b5a88e2e390fb8f8d24eb1736f71e0 (XP
# section), checked against ReactOS's copy of XP's classic schemes in
# boot/bootdata/hivedef.inf ("Control Panel\Appearance\New Schemes").
# XP's name. Its larger fonts and metrics aren't applied: no reliable
# reference for them was found, so Font size in Display Properties
# decides as for any other scheme.
[Scheme]
Name=Pumpkin (large)

[Colors]
Scrollbar=245 234 207
Background=66 0 66
ActiveTitle=215 165 47
InactiveTitle=160 160 164
Menu=236 213 157
Window=255 255 255
WindowFrame=0 0 0
MenuText=0 0 0
WindowText=0 0 0
TitleText=255 255 255
ActiveBorder=236 213 157
InactiveBorder=236 213 157
AppWorkspace=245 234 207
Hilight=128 0 128
HilightText=255 255 255
ButtonFace=236 213 157
ButtonShadow=215 165 47
GrayText=215 165 47
ButtonText=0 0 0
InactiveTitleText=245 234 207
ButtonHilight=245 234 207
ButtonDkShadow=0 0 0
ButtonLight=236 213 157
InfoText=128 0 128
InfoWindow=255 255 255
HotTrackingColor=215 165 47
GradientActiveTitle=224 204 136
GradientInactiveTitle=208 204 144
