# Windows 2000's default classic scheme. The same as the built-in defaults;
# listed in full so it can be used as a template for new schemes.
# Colours: Windows XP's values as listed in "Windows System Colours (by OS)",
# https://gist.github.com/zaxbux/64b5a88e2e390fb8f8d24eb1736f71e0 (XP
# section), checked against ReactOS's copy of XP's classic schemes in
# boot/bootdata/hivedef.inf ("Control Panel\Appearance\New Schemes").
[Scheme]
Name=Windows Standard
GradientCaptions=true

[Colors]
Scrollbar=212 208 200
Background=58 110 165
ActiveTitle=10 36 106
InactiveTitle=128 128 128
Menu=212 208 200
Window=255 255 255
WindowFrame=0 0 0
MenuText=0 0 0
WindowText=0 0 0
TitleText=255 255 255
ActiveBorder=212 208 200
InactiveBorder=212 208 200
AppWorkspace=128 128 128
Hilight=10 36 106
HilightText=255 255 255
ButtonFace=212 208 200
ButtonShadow=128 128 128
GrayText=128 128 128
ButtonText=0 0 0
InactiveTitleText=212 208 200
ButtonHilight=255 255 255
ButtonDkShadow=64 64 64
ButtonLight=212 208 200
InfoText=0 0 0
InfoWindow=255 255 225
HotTrackingColor=0 0 128
GradientActiveTitle=166 202 240
GradientInactiveTitle=192 192 192
MenuHilight=10 36 106
MenuBar=212 208 200

[Metrics]
BorderWidth=1
CaptionHeight=18
CaptionButtonWidth=16
MenuHeight=18
ScrollWidth=16

[Fonts]
CaptionFont=Tahoma, DejaVu Sans Condensed, DejaVu Sans, sans-serif, 8, bold
MenuFont=Tahoma, DejaVu Sans Condensed, DejaVu Sans, sans-serif, 8
MessageFont=Tahoma, DejaVu Sans Condensed, DejaVu Sans, sans-serif, 8
IconFont=Tahoma, DejaVu Sans Condensed, DejaVu Sans, sans-serif, 8
StatusFont=Tahoma, DejaVu Sans Condensed, DejaVu Sans, sans-serif, 8
