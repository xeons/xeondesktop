# Windows XP style, Energy Blue colour scheme: the system colours of the
# "Royale" visual style Microsoft shipped with XP Media Center and Tablet
# PC editions. The frame, taskbar and Start button artwork take their
# colours from LunaColor.
# Colours: Default (blue)'s (XP's values as listed in "Windows System
# Colours (by OS)", https://gist.github.com/zaxbux/64b5a88e2e390fb8f8d24eb1736f71e0)
# except where a Royale screenshot shows otherwise: ActiveTitle and
# GradientActiveTitle are its caption's body and top colours, as Blue's
# are, and ButtonFace and MenuBar its lighter, cooler grey (Explorer's
# menu bar and an unfocused selection). The screenshots show no inactive
# window: InactiveTitle and GradientInactiveTitle are Blue's lighter
# inactive colour, an assumption.
[Scheme]
Name=Energy Blue
LunaColor=EnergyBlue

[Colors]
Scrollbar=212 208 200
Background=0 78 152
ActiveTitle=109 170 233
InactiveTitle=157 185 235
Menu=255 255 255
