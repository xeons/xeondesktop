# A Windows 2000/XP classic colour scheme.
# Colours: Windows XP's values as listed in "Windows System Colours (by OS)",
# https://gist.github.com/zaxbux/64b5a88e2e390fb8f8d24eb1736f71e0 (XP
# section), checked against ReactOS's copy of XP's classic schemes in
# boot/bootdata/hivedef.inf ("Control Panel\Appearance\New Schemes").
[Scheme]
Name=Red, White, and Blue (VGA)

[Colors]
Scrollbar=192 192 192
Background=0 0 66
ActiveTitle=128 0 0
InactiveTitle=128 128 128
Menu=192 192 192
Window=255 255 255
WindowFrame=0 0 0
MenuText=0 0 0
WindowText=0 0 0
TitleText=255 255 255
ActiveBorder=192 192 192
InactiveBorder=192 192 192
AppWorkspace=255 255 255
Hilight=128 0 0
HilightText=255 255 255
ButtonFace=192 192 192
ButtonShadow=128 128 128
GrayText=128 128 128
ButtonText=0 0 0
InactiveTitleText=192 192 192
ButtonHilight=255 255 255
ButtonDkShadow=0 0 0
ButtonLight=192 192 192
InfoText=0 0 128
InfoWindow=255 255 255
HotTrackingColor=128 0 0
GradientActiveTitle=0 16 168
GradientInactiveTitle=186 190 201
MenuHilight=128 0 0
MenuBar=192 192 192
