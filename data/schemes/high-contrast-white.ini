# Black on white, for low vision.
# Colours: Windows XP's values as listed in "Windows System Colours (by OS)",
# https://gist.github.com/zaxbux/64b5a88e2e390fb8f8d24eb1736f71e0 (XP
# section), checked against ReactOS's copy of XP's classic schemes in
# boot/bootdata/hivedef.inf ("Control Panel\Appearance\New Schemes").
# The sizes below are unverified (no reference found for XP's).
[Scheme]
Name=High Contrast White
GradientCaptions=false
HighContrast=true

[Colors]
Scrollbar=255 255 255
Background=255 255 255
ActiveTitle=0 0 0
InactiveTitle=255 255 255
Menu=255 255 255
Window=255 255 255
WindowFrame=0 0 0
MenuText=0 0 0
WindowText=0 0 0
TitleText=255 255 255
ActiveBorder=128 128 128
InactiveBorder=192 192 192
AppWorkspace=128 128 128
Hilight=0 0 0
HilightText=255 255 255
ButtonFace=255 255 255
ButtonShadow=128 128 128
GrayText=0 255 0
ButtonText=0 0 0
InactiveTitleText=0 0 0
ButtonHilight=192 192 192
ButtonDkShadow=0 0 0
ButtonLight=192 192 192
InfoText=0 0 0
InfoWindow=255 255 255
HotTrackingColor=0 0 0
GradientActiveTitle=0 0 0
GradientInactiveTitle=255 255 255
MenuHilight=0 0 0
MenuBar=255 255 255

[Metrics]
BorderWidth=3
CaptionHeight=22
CaptionButtonWidth=20

[Fonts]
CaptionFont=Tahoma, DejaVu Sans Condensed, DejaVu Sans, sans-serif, 10, bold
MenuFont=Tahoma, DejaVu Sans Condensed, DejaVu Sans, sans-serif, 10
MessageFont=Tahoma, DejaVu Sans Condensed, DejaVu Sans, sans-serif, 10
