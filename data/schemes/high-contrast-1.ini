# Yellow text on black, for low vision.
# Colours: Windows XP's values as listed in "Windows System Colours (by OS)",
# https://gist.github.com/zaxbux/64b5a88e2e390fb8f8d24eb1736f71e0 (XP
# section), checked against ReactOS's copy of XP's classic schemes in
# boot/bootdata/hivedef.inf ("Control Panel\Appearance\New Schemes").
[Scheme]
Name=High Contrast #1
GradientCaptions=false
HighContrast=true

[Colors]
Scrollbar=0 0 0
Background=0 0 0
ActiveTitle=0 0 255
InactiveTitle=0 255 255
Menu=0 0 0
Window=0 0 0
WindowFrame=255 255 255
MenuText=255 255 255
WindowText=255 255 0
TitleText=255 255 255
ActiveBorder=0 0 255
InactiveBorder=0 255 255
AppWorkspace=0 0 0
Hilight=0 128 0
HilightText=255 255 255
ButtonFace=0 0 0
ButtonShadow=128 128 128
GrayText=0 255 0
ButtonText=255 255 255
InactiveTitleText=0 0 0
ButtonHilight=192 192 192
ButtonDkShadow=255 255 255
ButtonLight=255 255 255
InfoText=255 255 0
InfoWindow=0 0 0
HotTrackingColor=128 0 128
GradientActiveTitle=0 0 255
GradientInactiveTitle=0 255 255
MenuHilight=0 128 0
MenuBar=0 0 0
