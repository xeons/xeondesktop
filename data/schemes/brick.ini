# A Windows 2000/XP classic colour scheme.
# Colours: Windows XP's values as listed in "Windows System Colours (by OS)",
# https://gist.github.com/zaxbux/64b5a88e2e390fb8f8d24eb1736f71e0 (XP
# section), checked against ReactOS's copy of XP's classic schemes in
# boot/bootdata/hivedef.inf ("Control Panel\Appearance\New Schemes").
# Brick's MenuHilight follows the gist: ReactOS lists Desert's 0 128 128.
[Scheme]
Name=Brick

[Colors]
Scrollbar=225 224 210
Background=66 0 0
ActiveTitle=128 0 0
InactiveTitle=141 137 97
Menu=194 191 165
Window=255 255 255
WindowFrame=0 0 0
MenuText=0 0 0
WindowText=0 0 0
TitleText=225 224 210
ActiveBorder=194 191 165
InactiveBorder=194 191 165
AppWorkspace=225 224 210
Hilight=141 137 97
HilightText=255 255 255
ButtonFace=194 191 165
ButtonShadow=141 137 97
GrayText=141 137 97
ButtonText=0 0 0
InactiveTitleText=225 224 210
ButtonHilight=225 224 210
ButtonDkShadow=0 0 0
ButtonLight=194 191 165
InfoText=128 0 0
InfoWindow=225 224 210
HotTrackingColor=128 0 0
GradientActiveTitle=176 116 64
GradientInactiveTitle=200 184 112
MenuHilight=141 137 97
MenuBar=194 191 165
