Hilight=88 128 120
HilightText=255 255 255
ButtonFace=144 176 168
ButtonShadow=88 128 120
GrayText=88 128 120
ButtonText=0 0 0
InactiveTitleText=88 128 120
ButtonHilight=200 216 216
ButtonDkShadow=0 0 0
ButtonLight=144 176 168
InfoText=128 0 128
InfoWindow=255 255 255
