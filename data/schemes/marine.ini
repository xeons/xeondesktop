# A Windows 2000/XP classic colour scheme.
# Colours: Windows XP's values as listed in "Windows System Colours (by OS)",
# https://gist.github.com/zaxbux/64b5a88e2e390fb8f8d24eb1736f71e0 (XP
# section), checked against ReactOS's copy of XP's classic schemes in
# boot/bootdata/hivedef.inf ("Control Panel\Appearance\New Schemes").
[Scheme]
Name=Marine (high color)

[Colors]
Scrollbar=200 224 216
Background=44 78 71
ActiveTitle=0 0 128
InactiveTitle=72 144 136
Menu=136 192 184
Window=200 224 216
WindowFrame=0 0 0
MenuText=0 0 0
WindowText=0 0 0
TitleText=255 255 255
ActiveBorder=136 192 184
InactiveBorder=136 192 184
AppWorkspace=75 141 132
Hilight=0 0 128
HilightText=255 255 255
ButtonFace=136 192 184
ButtonShadow=72 144 136
GrayText=72 144 136
ButtonText=0 0 0
InactiveTitleText=192 192 192
ButtonHilight=200 224 216
ButtonDkShadow=0 0 0
ButtonLight=136 192 184
InfoText=0 0 0
InfoWindow=200 224 216
HotTrackingColor=0 0 128
GradientActiveTitle=24 180 192
GradientInactiveTitle=120 204 216
MenuHilight=0 0 128
MenuBar=136 192 184
