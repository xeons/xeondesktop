# Windows XP style, Dark colour scheme: not one of XP's, ours. Luna Blue's
# frame, taskbar and controls are redrawn in charcoal with a little of
# their blue kept (luna.c), and these system colours darken what's inside
# windows: dark dialogs, fields and menus, light text, and Luna's blue for
# the selection and links. ActiveTitle and GradientActiveTitle are the
# recoloured caption's body and top colours, as Blue's are.
[Scheme]
Name=Dark
LunaColor=Dark

