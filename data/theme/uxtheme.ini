# Deduced, not documented: Explorer's taskbar, thumbnails and Start menu
# in Vista and 7 (docs/THEMES.md). Named from their images, sizes and
# where 7 draws them; the rest stay numbered:
# - TaskBand2 (7's taskbar buttons): AppButton's ten frames, of which we
#   use 1-3 (a background window's button: normal, hot, pressed), 4-6
#   (the active one's) and 7 (flashing); 8-10 are unknown. AppButtonStack
#   (and Lit) are the edges of a group's other windows, frames 1-3 for
#   none, one or two. The four 42x5 bars are ITaskbarList3's progress:
#   green, a fading green sweep, red and yellow. 1-4 (lines along each
#   edge) and 6-8 (buttons cut off on the right) are unknown.
# - TaskbandExtendedUI (7's thumbnails): the popup's frame, the shadow
#   around a preview, a hovered thumbnail's highlight (hot 1, pressed 2),
#   the title's colour and the red close button (normal, hot, pressed).
#   5 (a 6x6 frame), 8-11 (glass buttons: likely the thumbnail toolbar's)
#   and 13 (small arrows) are unknown.
# - StartPanel's parts past 11 (Vista's Start menu, kept in 7's): the
#   "Back" arrow of All Programs and the arrow beside the power buttons.
# - StartPanelPriv (7's Start menu): its parts named as StartPanel's
#   where they have StartPanel's images or DefaultPaneSize, a program's
#   highlight (whole, or split into its name and its jump list's arrow,
#   frames hot, hot, pressed and a new program's orange), a place's
#   highlight and the Shut down button. 3, 5, 7, 10, 12-20, 22, 25-27 and
#   32-36 are unknown.
[Deduced TaskBand2 6.1]
