# The unit systemd's XDG autostart generator makes of VirtualBox's
# vboxclient.desktop: in a XeonDesktop session, start its clipboard as a
# Wayland client (see xd-vboxclient). Without VirtualBox there's no such
# unit and this does nothing.
[Service]
ExecStart=
ExecStart=@LIBEXECDIR@/xd-vboxclient
