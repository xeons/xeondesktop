# Which xdg-desktop-portal backends a XeonDesktop session uses: our own for
# file choosers (Open and Save As), GTK's for the rest, wlroots' for
# screenshots and screen sharing.
[preferred]
default=gtk
org.freedesktop.impl.portal.FileChooser=xeondesktop
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.ScreenCast=wlr
